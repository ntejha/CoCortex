[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cocortex"
version = "0.1.0"
description = "Reliability-first shared memory framework for multi-agent LLM systems"
requires-python = ">=3.10"

dependencies = [
    "groq",
    "pydantic",
    "langchain>=0.1.16",
    "langchain-core>=0.1.40",
    "langchain-community>=0.1.16",
    "langchain-groq>=0.1.3",
    "python-dotenv>=1.0.1",
    "pytest>=9.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
]

[tool.setuptools.packages.find]
where = ["."]
exclude = [
    "venv*",
    "*.egg-info*",
    "experiments*",
    "tests*",
    "Documentation*",
    "Papers*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
