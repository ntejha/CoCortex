[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cocortex"
version = "0.1.0"
description = "Reliability-first shared memory framework for multi-agent LLM systems"
requires-python = ">=3.10"

dependencies = [
    "groq",
    "pydantic",
    "langchain<0.3.0",
    "langchain-core<0.3.0",
    "langchain-community<0.3.0",
    "langchain-groq<0.2.0",
    "python-dotenv>=1.0.1",
    "pytest>=9.0.2",
    "sentence-transformers>=2.2.0",
    "faiss-cpu>=1.7.4",
    "numpy>=1.24",
    "aiosqlite>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "pytest-asyncio>=0.23.0",
]

[tool.setuptools.packages.find]
where = ["."]
exclude = [
    "venv*",
    "*.egg-info*",
    "experiments*",
    "tests*",
    "Documentation*",
    "Papers*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
